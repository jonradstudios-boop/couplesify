name: Build Android APK (Couplesify)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install project dependencies
        run: npm install

      - name: ⚙️ Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          packager: npm

      - name: 🚀 Run Expo Prebuild (Generate Android native project)
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🔑 Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: 🛠️ Build Standalone Release APK (Bundles JS & Assets)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📦 Prepare Named Standalone APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Couplesify.apk

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: couplesify-apk
          path: Couplesify.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🏷️ Publish APK to GitHub Releases (Direct Download Link)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Couplesify v1.0.0 Standalone APK"
          body: |
            ### 💕 Couplesify Android Standalone APK
            - **100% Standalone APK** — Pre-bundled JavaScript & assets; no Metro, no computer, no localhost needed!
            - Real-time cloud sync powered by Firebase (`couplesify-9805b`).
            - Supports large photos with automatic compression, Sweet Snaps, keepsakes, and games.
            
            **Direct Download:** Download `Couplesify.apk` below directly to your Android device.
          files: Couplesify.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
